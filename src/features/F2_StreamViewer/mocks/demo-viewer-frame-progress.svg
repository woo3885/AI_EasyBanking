<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title description">
  <title id="title">금융길잡이 Mock 진행 화면</title>
  <desc id="description">프론트 Viewer 연속 프레임 Preview를 위한 두 번째 가상 화면</desc>
  <rect width="1280" height="720" fill="#ecfdf3" />
  <rect width="1280" height="92" fill="#05603a" />
  <text x="64" y="58" fill="#ffffff" font-family="sans-serif" font-size="30" font-weight="700">금융길잡이 Mock Preview</text>
  <rect x="64" y="140" width="1152" height="496" rx="24" fill="#ffffff" stroke="#6ce9a6" stroke-width="3" />
  <text x="112" y="220" fill="#054f31" font-family="sans-serif" font-size="36" font-weight="700">두 번째 Mock 프레임 표시</text>
  <text x="112" y="272" fill="#344054" font-family="sans-serif" font-size="24">로컬 SVG 프레임 순서를 확인하는 테스트 화면입니다.</text>
  <rect x="112" y="332" width="976" height="42" rx="21" fill="#d1fadf" />
  <rect x="112" y="332" width="732" height="42" rx="21" fill="#12b76a" />
  <text x="112" y="430" fill="#101828" font-family="sans-serif" font-size="26" font-weight="700">Mock 프레임 진행 상태</text>
  <text x="112" y="480" fill="#475467" font-family="sans-serif" font-size="21">실제 WebSocket 연결 또는 개발자 B 캡처가 아닙니다.</text>
  <text x="112" y="530" fill="#475467" font-family="sans-serif" font-size="21">실제 금융정보와 민감정보를 포함하지 않습니다.</text>
  <text x="112" y="600" fill="#667085" font-family="sans-serif" font-size="18">D7 프론트 연속 렌더링 검증용 · 외부 네트워크 미사용</text>
</svg>
