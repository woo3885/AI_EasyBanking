name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Validate deployment configuration
        env:
          BACKEND_BASE_URL: ${{ vars.VITE_BACKEND_BASE_URL }}
          DEMO_BANK_BASE_URL: ${{ vars.VITE_DEMO_BANK_BASE_URL }}
        run: |
          test -n "$BACKEND_BASE_URL"
          test -n "$DEMO_BANK_BASE_URL"
          case "$BACKEND_BASE_URL" in
            https://*) ;;
            *) echo "VITE_BACKEND_BASE_URL must use HTTPS" >&2; exit 1 ;;
          esac
          case "$DEMO_BANK_BASE_URL" in
            https://*) ;;
            *) echo "VITE_DEMO_BANK_BASE_URL must use HTTPS" >&2; exit 1 ;;
          esac

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build frontend
        env:
          VITE_BACKEND_BASE_URL: ${{ vars.VITE_BACKEND_BASE_URL }}
          VITE_DEMO_BANK_BASE_URL: ${{ vars.VITE_DEMO_BANK_BASE_URL }}
          GITHUB_PAGES_BASE: /AI_EasyBanking/
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
