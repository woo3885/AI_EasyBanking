spring:
  application:
    name: finance-guide-backend

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      connect-timeout: 2s

  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  health:
    redis:
      enabled: false

ddd:
  final-confirmation:
    timeout: ${DDD_FINAL_CONFIRMATION_TIMEOUT:5m}
  session-store:
    type: ${DDD_SESSION_STORE_TYPE:memory}

    # D8
    # 마지막 save 이후 세션 유지 시간.
    ttl: ${DDD_SESSION_TTL:30m}

    # D8
    # Redis TTL이 끝난 BrowserSession을
    # 찾아 정리하는 주기.
    cleanup-interval-ms: ${DDD_SESSION_CLEANUP_INTERVAL_MS:5000}

  demo-bank:
    enabled: ${DDD_DEMO_BANK_ENABLED:false}
    base-url: ${DEMO_BANK_BASE_URL:http://127.0.0.1:5190}

  frame-websocket:
    allowed-origins: ${DDD_FRAME_WS_ALLOWED_ORIGINS:http://127.0.0.1:5173}

  rest-cors:
    allowed-origins: ${DDD_REST_CORS_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://127.0.0.1:5190}

  # 로컬 Demo/E2E 전용. 활성화하면 사용자가 동일 Playwright Page를
  # headed 창에서 직접 조작하며 Backend는 입력값을 읽거나 전달하지 않는다.
  secure-takeover:
    demo-headed-enabled: ${DDD_SECURE_TAKEOVER_DEMO_HEADED_ENABLED:false}
    completion-timeout: ${DDD_SECURE_COMPLETION_TIMEOUT:5m}
    cleanup-interval-ms: ${DDD_SECURE_CLEANUP_INTERVAL_MS:1000}

  demo-agent-bridge:
    enabled: ${DDD_DEMO_AGENT_BRIDGE_ENABLED:false}
    headed-enabled: ${DDD_DEMO_AGENT_BRIDGE_HEADED_ENABLED:false}
    ttl: ${DDD_DEMO_AGENT_BRIDGE_TTL:30m}
    allowed-origins: ${DDD_DEMO_AGENT_BRIDGE_ALLOWED_ORIGINS:http://127.0.0.1:5190}

  ai:
    engine:
      enabled: ${DDD_AI_ENGINE_ENABLED:true}
      endpoint: ${AI_ENGINE_ENDPOINT:http://127.0.0.1:3001/api/ai/action}
      connect-timeout: ${AI_ENGINE_CONNECT_TIMEOUT:3s}
      request-timeout: ${AI_ENGINE_REQUEST_TIMEOUT:15s}
